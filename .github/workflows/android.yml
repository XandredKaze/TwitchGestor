# Musicante Player per Android: GitHub costruisce l'APK (gratis) quando cambia l'app o la versione,
# e lo mette in apps/MusicantePlayer.apk: il Raspberry lo prende con l'aggiornamento e lo offre da scaricare.
name: Musicante Player Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Chiave di firma (segreto MUSICANTE_KEYSTORE, facoltativo)
        env:
          KEYSTORE_B64: ${{ secrets.MUSICANTE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/musicante.jks"; echo "MUSICANTE_KEYSTORE_FILE=$RUNNER_TEMP/musicante.jks" >> "$GITHUB_ENV"; fi
      - name: Costruisci l'APK
        working-directory: android/player
        env:
          MUSICANTE_KEYSTORE_PASSWORD: ${{ secrets.MUSICANTE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Metti l'APK nel repository
        run: |
          cp android/player/app/build/outputs/apk/release/app-release.apk apps/MusicantePlayer.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/MusicantePlayer.apk
          if git diff --cached --quiet; then echo "APK uguale"; exit 0; fi
          git commit -m "Musicante Player Android: APK costruito da GitHub"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
