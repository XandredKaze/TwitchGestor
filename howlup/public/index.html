<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Howl-UP</title>
  <meta name="theme-color" content="#121016">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Howl-UP">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand"><img src="icon.svg" alt="" width="34" height="34"><b>Howl<span>-UP</span></b></div>
      <div class="top-date" id="top-date"></div>
    </header>
    <nav class="nav" id="nav" aria-label="Sezioni">
      <button data-view="today" class="active"><span>☀️</span>Oggi</button>
      <button data-view="calendar"><span>📅</span>Calendario</button>
      <button data-view="tasks"><span>✅</span>Da fare</button>
      <button data-view="more"><span>⚙️</span>Altro</button>
    </nav>
    <main id="view" class="view"></main>
    <button class="fab" id="fab" aria-label="Aggiungi">＋</button>
  </div>
  <div id="sheet-root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
