<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Musica per OBS</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Bungee&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="/music.css">
</head>
<body>
  <audio id="audio" preload="auto"></audio>
  <div id="widget" class="np" hidden>

    </div>

  <button id="unlock" type="button" hidden>🔊 Clicca per attivare l'audio</button>
  <script src="/music.js"></script>

</html>
