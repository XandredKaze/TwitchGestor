<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titoli di coda</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   STILE DEI TITOLI DI CODA
   Le variabili qui sotto sono i valori predefiniti: colori, font e
   dimensioni principali si cambiano anche dal pannello.
   Per modifiche più profonde lavora sulle regole .cr-... più in basso.
   ===================================================================== */
:root {
  --cr-font-title: 'Cinzel', serif;      /* titolo iniziale, sezioni, sottotitoli, badge */
  --cr-font-text: 'Inter', sans-serif;   /* nomi e testi descrittivi */
  --cr-header-color: #ffffff;            /* titolo iniziale e testo finale */
  --cr-accent: #9147ff;                  /* titoli di sezione e linee laterali */
  --cr-glow: #9147ff99;                  /* bagliore del titolo iniziale (accento + trasparenza) */
  --cr-sub-color: #bf94ff;               /* sottotitoli (Subscribers, Gifted) e testo sotto il titolo */
  --cr-name-color: #e8deff;
  --cr-header-size: 52px;
  --cr-title-size: 22px;
  --cr-name-size: 28px;
  --cr-name-shadow: none;
  --cr-bg: transparent;
  --cr-columns: 1;
  --cr-name-align: center;               /* allineamento dei nomi */
  --cr-name-gap: 4px;                    /* spazio verticale tra i nomi */
  --cr-name-weight: 400;
  --cr-name-transform: none;             /* uppercase = tutto maiuscolo */
  --cr-name-spacing: .04em;              /* spaziatura tra le lettere */
  --cr-exit: 0%;                         /* linea di uscita: dove i nomi spariscono (0% = bordo alto) */
  --cr-entry: 100%;                      /* linea di entrata: dove i nomi compaiono (100% = bordo basso) */
}
html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }

/* --- contenitore e scorrimento --- */
#stage { position: fixed; inset: 0; overflow: hidden; background: var(--cr-bg); }
/* i nomi sono visibili solo tra la linea di uscita (in alto) e quella di entrata (in basso), con 40px di dissolvenza su entrambe */
#roll-mask { position: absolute; inset: 0; z-index: 1; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent var(--cr-exit), #000 calc(var(--cr-exit) + 40px), #000 calc(var(--cr-entry) - 40px), transparent var(--cr-entry));
          mask-image: linear-gradient(to bottom, transparent var(--cr-exit), #000 calc(var(--cr-exit) + 40px), #000 calc(var(--cr-entry) - 40px), transparent var(--cr-entry)); }
#roll { position: absolute; left: 0; right: 0; top: 0; z-index: 1; text-align: center; padding: 0 60px; will-change: transform; transform: translateY(100vh); }

/* --- decorazioni: particelle luminose sullo sfondo --- */
#particles { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

/* --- testo iniziale --- */
.cr-header { margin-bottom: 60px; }
.cr-header h1 { margin: 0 0 16px; font-family: var(--cr-font-title); font-size: var(--cr-header-size); font-weight: 700; line-height: 1.2; color: var(--cr-header-color); letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 0 40px var(--cr-glow); }
.cr-header p { margin: 0; font-family: var(--cr-font-text); font-size: calc(var(--cr-name-size) * .64); font-weight: 300; color: var(--cr-sub-color); letter-spacing: .06em; }

/* --- sezione (Iscritti, Gift, Follower) --- */
.cr-section { margin: 0 auto 80px; }
.cr-title { margin: 0 0 16px; font-family: var(--cr-font-title); font-size: var(--cr-title-size); font-weight: 600; color: var(--cr-accent); letter-spacing: .18em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 20px; }
.cr-title::before, .cr-title::after { content: ''; flex: 1; height: 2px; border-radius: 2px; background: linear-gradient(to right, transparent, var(--cr-accent)); }
.cr-title::after { background: linear-gradient(to left, transparent, var(--cr-accent)); }
.cr-subtitle { margin: 28px 0 14px; font-family: var(--cr-font-title); font-size: calc(var(--cr-title-size) * 1.1); font-weight: 600; color: var(--cr-sub-color); letter-spacing: .16em; text-transform: uppercase; }
.cr-title + .cr-subtitle { margin-top: 0; }

/* --- nomi --- */
.cr-names { list-style: none; margin: 0 auto 8px; padding: 0; display: grid; grid-template-columns: repeat(var(--cr-columns), minmax(0, 1fr)); gap: var(--cr-name-gap) 1.5em; max-width: calc(var(--cr-columns) * 560px); }
.cr-name { padding: 8px 0; font-family: var(--cr-font-text); font-size: var(--cr-name-size); font-weight: var(--cr-name-weight); color: var(--cr-name-color); letter-spacing: var(--cr-name-spacing); text-transform: var(--cr-name-transform); text-align: var(--cr-name-align); text-shadow: var(--cr-name-shadow); overflow-wrap: anywhere; }
.cr-icon { margin-right: .4em; }
/* testo libero delle sezioni aggiunte a mano */
.cr-text { max-width: 900px; margin: 0 auto 16px; font-family: var(--cr-font-text); font-size: calc(var(--cr-name-size) * .75); color: var(--cr-sub-color); white-space: pre-line; line-height: 1.5; }

/* --- immagini: logo in cima e immagine finale --- */
.cr-logo { display: block; margin: 0 auto 28px; max-width: 90%; height: auto; }
.cr-footer-img { display: block; margin: 36px auto 0; max-width: 90%; height: auto; }

/* --- sfondo: immagine o video sotto a tutto --- */
#bg-media { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

/* --- effetto di comparsa dei nomi quando superano la linea di entrata --- */
.fx-fade .cr-name { opacity: 0; transition: opacity .9s ease; }
.fx-rise .cr-name { opacity: 0; transform: translateY(40px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,1,.3,1); }
.fx-zoom .cr-name { opacity: 0; transform: scale(.6); transition: opacity .7s ease, transform .7s cubic-bezier(.2,1.4,.4,1); }
.fx-slide .cr-name { opacity: 0; transform: translateX(-80px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,1,.3,1); }
.fx-fade .cr-name.in, .fx-rise .cr-name.in, .fx-zoom .cr-name.in, .fx-slide .cr-name.in { opacity: 1; transform: none; }
.fx-glow .cr-name.in { animation: cr-glow 1.6s ease-out; }
@keyframes cr-glow { 0% { text-shadow: 0 0 0 transparent; } 30% { text-shadow: 0 0 24px var(--cr-accent), 0 0 8px var(--cr-accent); } 100% { text-shadow: var(--cr-name-shadow); } }
@media (prefers-reduced-motion: reduce) { .fx-rise .cr-name, .fx-zoom .cr-name, .fx-slide .cr-name { transform: none; } }
.cr-count { margin-left: .35em; color: var(--cr-sub-color); }

/* --- badge dorato del Top Gifter --- */
.cr-tag { display: inline-block; margin-left: 12px; padding: 3px 10px; vertical-align: middle; font-family: var(--cr-font-title); font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #2a1a00; background: linear-gradient(135deg, #fff3c4, #d4af37 40%, #a6791f 80%); border-radius: 20px; box-shadow: 0 0 12px rgba(212,175,55,.7); text-shadow: none; }

/* --- testo finale --- */
.cr-footer { margin-top: 20px; font-family: var(--cr-font-title); font-size: calc(var(--cr-header-size) * .7); font-weight: 700; color: var(--cr-header-color); letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 0 40px var(--cr-glow); }

/* =====================================================================
   PANNELLO DI CONTROLLO (non va in live)
   Tema scuro a riquadri. I colori del pannello sono le variabili --p-...
   ===================================================================== */
body.panel {
  --p-bg: #0c0a11;
  --p-card: #15121c;
  --p-card-hi: #1b1724;
  --p-field: #0f0d15;
  --p-line: #29233a;
  --p-text: #eeeaf6;
  --p-muted: #9790aa;
  --p-accent: #9147ff;
  --p-accent-hi: #ab74ff;
  --p-accent-soft: rgba(145, 71, 255, .16);
  --p-ok: #62e0a6;
  --p-err: #ff7b93;
  --p-radius: 20px;
  /* html resta overflow:hidden per l'overlay: nel pannello scorre il body */
  height: 100vh; overflow-y: auto;
  background: radial-gradient(900px 500px at 0% 0%, rgba(145, 71, 255, .13), transparent 60%), var(--p-bg);
  color: var(--p-text);
  font: 14px/1.5 'Nunito', system-ui, sans-serif;
  scrollbar-width: thin; scrollbar-color: #3a3050 transparent;
}
.panel #stage { display: none; }
body.embedded { background: var(--p-bg); }
.panel * { box-sizing: border-box; }

.p-wait, .p-offline { margin: 16px; padding: 12px 16px; border-radius: 14px; background: rgba(255, 123, 147, .12); border: 1px solid rgba(255, 123, 147, .35); color: #ffd0da; }
.p-offline { display: none; position: sticky; top: 8px; z-index: 9; }
body.offline .p-offline { display: block; }

/* --- intestazione --- */
.p-wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 2px 16px; }
.p-brand { display: flex; align-items: center; gap: 12px; }
.p-logo { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; color: #fff; background: linear-gradient(135deg, var(--p-accent-hi), #6a2bd9); box-shadow: 0 8px 24px -8px var(--p-accent); }
.p-brand h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: .01em; }
.p-brand p { margin: 0; font-size: 12.5px; color: var(--p-muted); }
.p-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.p-pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; background: var(--p-card); border: 1px solid var(--p-line); font-size: 12.5px; color: var(--p-muted); }
.p-pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #5d5670; }
.p-pill.ok::before { background: var(--p-ok); box-shadow: 0 0 8px var(--p-ok); }
.p-pill.err::before { background: var(--p-err); box-shadow: 0 0 8px var(--p-err); }

/* --- griglia a riquadri: 1 colonna nel dock stretto, 2 o 3 quando è largo --- */
.p-grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); grid-auto-flow: dense; }
@media (min-width: 720px) {
  .p-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .p-card.wide, .p-card.full { grid-column: 1 / -1; }
}
@media (min-width: 1100px) {
  .p-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .p-card.wide { grid-column: span 2; }
  .p-card.tall { grid-row: span 2; }
}
.p-card { min-width: 0; padding: 18px; border-radius: var(--p-radius); background: linear-gradient(180deg, var(--p-card-hi), var(--p-card)); border: 1px solid var(--p-line); }
.p-card h2 { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; font-size: 12.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--p-muted); }
.p-card h2::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--p-accent); box-shadow: 0 0 10px var(--p-accent); }
.p-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 24px; }

/* --- riquadri numerici delle categorie --- */
.p-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.p-tile { padding: 14px; border-radius: 16px; background: var(--p-field); border: 1px solid var(--p-line); transition: opacity .2s, border-color .2s; }
.p-tile:not(.off) { border-color: rgba(145, 71, 255, .35); }
.p-tile.off { opacity: .45; }
.p-tile-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; font-weight: 700; }
.p-tile-num { margin-top: 6px; font-size: 32px; font-weight: 800; line-height: 1.1; background: linear-gradient(135deg, #fff, var(--p-accent-hi)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.p-tile-sub { font-size: 12px; color: var(--p-muted); }

/* --- campi --- */
.p-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.p-row + .p-row { border-top: 1px solid rgba(255, 255, 255, .04); }
.p-row label { flex: 1 1 auto; }
.p-field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 12px; }
.p-field label { font-size: 12.5px; font-weight: 700; color: var(--p-muted); }
.p-speed { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--p-muted); }
.panel .p-speed input[type=range] { flex: 1 1 auto; width: auto; }
.panel input[type=text], .panel input[type=number], .panel textarea {
  width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--p-line);
  background: var(--p-field); color: var(--p-text); font: inherit; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.panel textarea { min-height: 84px; resize: vertical; }
.panel input[type=number] { width: 92px; flex: 0 0 auto; text-align: center; }
.panel input:focus-visible, .panel textarea:focus-visible, .panel button:focus-visible { border-color: var(--p-accent); box-shadow: 0 0 0 3px var(--p-accent-soft); outline: none; }
.panel input[type=range] { width: 150px; flex: 0 1 auto; accent-color: var(--p-accent); }

/* interruttori al posto delle caselle */
.panel input[type=checkbox] { appearance: none; -webkit-appearance: none; position: relative; flex: 0 0 auto; width: 40px; height: 23px; margin: 0; border-radius: 999px; background: #2c263c; cursor: pointer; transition: background .2s; }
.panel input[type=checkbox]::after { content: ''; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #bdb4d3; transition: transform .2s, background .2s; }
.panel input[type=checkbox]:checked { background: var(--p-accent); }
.panel input[type=checkbox]:checked::after { transform: translateX(17px); background: #fff; }
.panel input[type=checkbox]:focus-visible { box-shadow: 0 0 0 3px var(--p-accent-soft); outline: none; }

/* colori come pallini */
.panel input[type=color] { flex: 0 0 auto; width: 32px; height: 32px; padding: 0; border: 2px solid var(--p-line); border-radius: 50%; background: none; cursor: pointer; }
.panel input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.panel input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }

/* --- pulsanti --- */
.p-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.panel button { padding: 9px 15px; border: 0; border-radius: 12px; background: linear-gradient(135deg, var(--p-accent-hi), var(--p-accent)); color: #fff; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px -10px var(--p-accent); transition: filter .15s, transform .1s; }
.panel button:hover { filter: brightness(1.1); }
.panel button:active { transform: translateY(1px); }
.panel button.sec { background: var(--p-field); border: 1px solid var(--p-line); color: var(--p-text); box-shadow: none; }
.panel button.danger { background: transparent; border: 1px solid rgba(255, 123, 147, .4); color: var(--p-err); box-shadow: none; }
.panel button:disabled { opacity: .5; cursor: default; filter: none; }

/* --- testi di stato --- */
.p-hint { margin: 6px 0 0; font-size: 12.5px; color: var(--p-muted); }
.p-status { margin-top: 10px; font-size: 13px; color: var(--p-muted); }
.p-status:empty { display: none; }
.p-status.err { color: var(--p-err); }
.p-status.ok { color: var(--p-ok); }
.p-account { display: flex; align-items: center; gap: 12px; }
.p-avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--p-accent-soft); color: var(--p-accent-hi); text-transform: uppercase; }
.p-code-box { margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--p-field); border: 1px dashed rgba(145, 71, 255, .5); }
.p-code-box a { color: var(--p-accent-hi); word-break: break-all; }
.p-code { margin: 6px 0 10px; font-size: 28px; font-weight: 800; letter-spacing: .18em; color: #fff; text-shadow: 0 0 18px var(--p-accent); user-select: all; }

/* --- elenco nomi --- */
.p-cat + .p-cat { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .05); }
.p-cat-head { display: flex; justify-content: space-between; font-weight: 700; }
.p-cat-head .off { color: var(--p-muted); font-weight: 400; }
.p-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; max-height: 132px; overflow: auto; }
.p-chip { padding: 3px 10px; border-radius: 999px; background: var(--p-accent-soft); color: #dccbff; font-size: 12.5px; }
.p-chip.top { background: linear-gradient(135deg, #fff3c4, #d4af37); color: #2a1a00; font-weight: 700; }
.p-chip.grp { padding-left: 2px; background: none; color: var(--p-accent-hi); font-weight: 800; }
.p-hint-top { margin: -4px 0 12px; }
/* zona di trascinamento del brano */
.p-drop { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; padding: 12px; border-radius: 14px; border: 1.5px dashed rgba(145, 71, 255, .45); background: rgba(145, 71, 255, .07); transition: background .15s, border-color .15s; }
.p-drop.over { border-color: var(--p-accent-hi); background: rgba(145, 71, 255, .25); }
.p-drop-icon { flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(135deg, var(--p-accent-hi), var(--p-accent)); color: #fff; font-size: 18px; }
.p-drop-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.p-drop-text span { font-size: 12px; color: var(--p-muted); }
/* colonne dei nomi in arrivo */
.p-names { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.p-col { display: flex; flex-direction: column; min-width: 0; padding: 10px; border-radius: 14px; background: var(--p-field); border: 1px solid var(--p-line); transition: opacity .2s; }
.p-col.off { opacity: .5; }
.p-col-sec { min-height: 16px; font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--p-muted); }
.p-col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 8px; padding: 0 4px 8px; border-bottom: 1px solid var(--p-line); }
.p-col-title { font-weight: 800; color: var(--p-accent-hi); }
.p-col-count { padding: 1px 8px; border-radius: 999px; background: var(--p-accent-soft); color: #dccbff; font-size: 12px; font-weight: 700; }
.p-list { display: flex; flex-direction: column; gap: 1px; max-height: 240px; overflow-y: auto; }
.p-empty { padding: 5px 8px; font-size: 12.5px; color: var(--p-muted); }
.panel button.p-item { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 8px; border: 0; border-radius: 8px; background: transparent; box-shadow: none; color: var(--p-text); font-weight: 400; text-align: left; }
.p-item .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-item .c { font-size: 12px; font-weight: 700; color: var(--p-accent-hi); }
.p-item .x { font-size: 11px; color: var(--p-err); opacity: 0; }
.p-item.top .n { color: #f3d27a; font-weight: 700; }
.panel button.p-item:hover { filter: none; background: rgba(255, 123, 147, .1); }
.panel button.p-item:hover .n { color: #ffd0da; text-decoration: line-through; }
.panel button.p-item:hover .x, .panel button.p-item:focus-visible .x { opacity: 1; }
.p-excluded { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .05); }
/* nomi cliccabili: al passaggio del mouse mostrano che verranno esclusi */
.panel button.p-chip { border: 1px solid transparent; box-shadow: none; font-weight: 400; line-height: 1.5; background: var(--p-accent-soft); color: #dccbff; }
.panel button.p-chip.top { background: linear-gradient(135deg, #fff3c4, #d4af37); color: #2a1a00; font-weight: 700; }
.panel button.p-chip:hover { filter: none; background: rgba(255, 123, 147, .14); border-color: rgba(255, 123, 147, .45); color: #ffd0da; text-decoration: line-through; }
.panel .p-excluded button.p-chip { background: transparent; border-color: var(--p-line); color: var(--p-muted); text-decoration: line-through; }
.panel .p-excluded button.p-chip:hover { background: rgba(98, 224, 166, .12); border-color: rgba(98, 224, 166, .45); color: var(--p-ok); text-decoration: none; }

/* --- selettore dei font --- */
.fp { position: relative; }
.panel button.fp-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--p-line); background: var(--p-field); color: var(--p-text); box-shadow: none; font-weight: 400; font-size: 17px; text-align: left; }
.panel button.fp-btn:hover { filter: none; border-color: var(--p-accent); }
.fp-btn .fp-cur { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fp-btn .fp-caret { flex: 0 0 auto; font-family: 'Nunito', system-ui, sans-serif; font-size: 12px; color: var(--p-muted); }
.fp-pop { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); min-width: min(360px, 88vw); padding: 10px; border-radius: 16px; background: var(--p-card-hi); border: 1px solid var(--p-accent); box-shadow: 0 18px 50px rgba(0, 0, 0, .55); }
.fp-pop[hidden] { display: none; }
.fp-cats { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.panel .fp-cats button { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--p-field); border: 1px solid var(--p-line); color: var(--p-muted); box-shadow: none; }
.panel .fp-cats button.on { background: var(--p-accent); border-color: var(--p-accent); color: #fff; }
.fp-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.panel .fp-list button { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; background: transparent; box-shadow: none; color: var(--p-text); font-weight: 400; font-size: 20px; text-align: left; }
.panel .fp-list button:hover, .panel .fp-list button:focus-visible { filter: none; background: var(--p-accent-soft); }
.panel .fp-list button.sel { background: var(--p-accent-soft); outline: 1px solid var(--p-accent); }
.fp-list small { flex: 0 0 auto; font-family: 'Nunito', system-ui, sans-serif; font-size: 11px; color: var(--p-muted); }
.fp-count { font-size: 12px; color: var(--p-muted); margin: 4px 2px 0; }
.fp-custom { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--p-line); }
.fp-custom input { flex: 1; min-width: 0; }

/* --- menu a tendina --- */
.panel select { padding: 8px 10px; border-radius: 12px; border: 1px solid var(--p-line); background: var(--p-field); color: var(--p-text); font: inherit; outline: none; max-width: 100%; }
.panel select:focus-visible { border-color: var(--p-accent); box-shadow: 0 0 0 3px var(--p-accent-soft); }
.panel .p-row select { flex: 0 1 auto; }
.p-media { display: flex; gap: 6px; align-items: center; }
.p-media input[type=text] { flex: 1; min-width: 0; }
.p-sub { margin: 14px 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--p-accent-hi); }
/* --- elenco e modifica delle sezioni --- */
.p-sec-list { display: flex; flex-direction: column; gap: 6px; }
.p-sec { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--p-field); border: 1px solid var(--p-line); }
.p-sec.sel { border-color: var(--p-accent); box-shadow: 0 0 0 3px var(--p-accent-soft); }
.panel .p-sec button.arrow { padding: 4px 9px; background: transparent; border: 1px solid var(--p-line); box-shadow: none; color: var(--p-text); }
.panel .p-sec button.name { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; background: transparent; box-shadow: none; padding: 2px 6px; color: var(--p-text); line-height: 1.3; }
.p-sec button.name .nm, .p-sec button.name small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-sec button.name small { font-size: 11.5px; font-weight: 500; color: var(--p-muted); }
.p-sec { cursor: default; transition: border-color .15s, background .15s; }
.p-sec:hover { border-color: color-mix(in srgb, var(--p-accent) 50%, var(--p-line)); }
.p-sec.sel { background: linear-gradient(90deg, var(--p-accent-soft), var(--p-field)); }
.p-tag { padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--p-accent-soft); color: #dccbff; white-space: nowrap; }
.p-sec-wrap { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .p-sec-wrap { grid-template-columns: minmax(0, 1fr); } }
.p-sec-side { display: flex; flex-direction: column; gap: 8px; }
.panel button.p-sec-add { width: 100%; border-style: dashed; color: var(--p-accent-hi); }
.panel button.p-sec-add:hover { border-color: var(--p-accent); background: var(--p-accent-soft); }
.p-sec-editor { min-width: 0; padding: 16px; border-radius: 16px; background: rgba(0, 0, 0, .18); border: 1px solid var(--p-line); }
.p-ed-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: -2px 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--p-line); }
.p-ed-head h3 { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-ed-head .p-ed-kicker { display: block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--p-muted); }
.panel .p-ed-head button.danger { padding: 6px 12px; font-size: 13px; }
.panel .p-ed-head button.danger.armed { background: var(--p-err); color: #fff; }
.p-group { margin: 0 0 12px; padding: 14px; border-radius: 14px; background: rgba(255, 255, 255, .03); border: 1px solid var(--p-line); }
.p-group:last-child { margin-bottom: 0; }
.p-group > .p-sub:first-child { margin-top: 0; }
.p-group .p-field:last-child { margin-bottom: 0; }
.p-style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 14px; margin-top: 4px; }
.p-mini { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.p-mini > label { font-size: 12px; font-weight: 700; color: var(--p-muted); }
.panel .p-mini input[type=number], .panel .p-mini select { width: 100%; }
.p-style-custom { transition: opacity .2s; }
.p-style-custom.off { opacity: .45; }
.p-switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; margin: 10px 0 12px; border-radius: 12px; background: var(--p-accent-soft); }
.p-switch-row b { display: block; font-size: 14px; }
.p-switch-row span { font-size: 12.5px; color: var(--p-muted); }
.panel button.armed { background: var(--p-err); border-color: var(--p-err); color: #fff; }
.panel .p-sec button.del { padding: 4px 9px; background: transparent; border: 1px solid rgba(255, 123, 147, .4); box-shadow: none; color: var(--p-err); }
.panel .p-sec button.del.armed { background: var(--p-err); color: #fff; }
.p-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 18px; }

/* --- anteprima animazione --- */
.p-preview { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 14px; border: 1px solid var(--p-line); background: #07060a; }
/* cursore verticale con due pallini accanto all'anteprima:
   in alto la linea di uscita (i nomi spariscono), in basso quella di entrata (i nomi compaiono) */
.p-preview-wrap { display: flex; gap: 10px; align-items: stretch; }
.p-preview-wrap .p-preview { flex: 1; min-width: 0; }
.p-vslider { position: relative; flex: 0 0 22px; border-radius: 999px; background: var(--p-field); border: 1px solid var(--p-line); cursor: ns-resize; touch-action: none; }
.p-vslider::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); background: rgba(145, 71, 255, .15); }
.p-vrange { position: absolute; left: 50%; width: 4px; transform: translateX(-50%); border-radius: 2px; background: var(--p-accent); box-shadow: 0 0 8px var(--p-accent); pointer-events: none; }
.p-vthumb { position: absolute; left: 50%; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%, -50%); background: #fff; border: 3px solid var(--p-accent); box-shadow: 0 0 12px var(--p-accent); outline: none; }
.p-vthumb:focus-visible { box-shadow: 0 0 0 4px var(--p-accent-soft), 0 0 12px var(--p-accent); }
.p-guide { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--p-accent-hi); pointer-events: none; z-index: 2; }
.p-guide span { position: absolute; right: 6px; padding: 1px 7px; border-radius: 999px; background: rgba(145, 71, 255, .85); color: #fff; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
#exit-guide span { top: 2px; }
#entry-guide span { bottom: 2px; }
.p-preview iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; background: transparent; }

/* =====================================================================
   TITOLI DI CODA "BRUTALISM" (stile retro-computer): niente riquadri,
   titoli come "▢ SUBSCRIBERS ────", linee bianche sottili, accento lilla,
   titolo iniziale e testo finale a blocchi come "JUST CHATTING".
   ===================================================================== */
body.roll-brutal { --b-lilac: #b39bd3; --b-line: #e6e6e6; }
.roll-brutal .cr-header { margin-bottom: 110px; }
.roll-brutal .cr-header h1 { display: inline-block; margin: 0 0 22px; padding: 4px 0 4px 26px; border-left: 4px solid var(--b-line); text-align: left; font-family: 'Bungee', 'Arial Black', sans-serif; font-weight: 400; font-size: calc(var(--cr-header-size) * 1.3); line-height: .98; letter-spacing: 0; color: #fff; text-shadow: 0 4px 24px rgba(0, 0, 0, .6); text-transform: uppercase; }
.roll-brutal .cr-header h1 .w1 { display: block; color: var(--b-lilac); }
.roll-brutal .cr-header p { margin: 4px auto; font-family: 'Share Tech Mono', monospace; font-size: calc(var(--cr-name-size) * .62); color: #e6e6e6; letter-spacing: .04em; text-shadow: 0 2px 10px rgba(0, 0, 0, .8); }
/* linea "▢ STAY CONNECTED ▪ ────": quadratini alle estremità */
.roll-brutal .cr-header::after { content: ''; display: block; width: 720px; max-width: 86%; height: 12px; margin: 30px auto 0;
  background: linear-gradient(var(--b-line), var(--b-line)) 36px 50% / calc(100% - 58px) 2px no-repeat,
    linear-gradient(var(--b-line), var(--b-line)) 0 50% / 10px 10px no-repeat,
    linear-gradient(var(--b-line), var(--b-line)) 18px 50% / 8px 8px no-repeat,
    linear-gradient(var(--b-line), var(--b-line)) 100% 50% / 10px 10px no-repeat; }
/* sezioni senza riquadro: titolo e sottotitoli come "▢ SUBSCRIBERS ────" */
.roll-brutal .cr-section { max-width: calc(var(--cr-columns) * 640px); margin: 0 auto 100px; }
.roll-brutal .cr-title, .roll-brutal .cr-subtitle { display: flex; align-items: center; justify-content: flex-start; gap: 14px; text-align: left; font-family: 'Share Tech Mono', monospace; font-weight: 400; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0, 0, 0, .7); }
.roll-brutal .cr-title { margin: 0 0 22px; font-size: calc(var(--cr-title-size) * 1.25); letter-spacing: .14em; color: var(--b-lilac); }
.roll-brutal .cr-title::before { content: ''; flex: none; width: 13px; height: 13px; background: var(--b-lilac); border: 2px solid var(--b-lilac); box-shadow: none; }
.roll-brutal .cr-title::after { content: ''; flex: 1; height: 2px; background: var(--b-line); box-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
.roll-brutal .cr-subtitle { margin: 26px 0 14px; font-size: calc(var(--cr-title-size) * .95); letter-spacing: .12em; color: #fff; }
.roll-brutal .cr-subtitle::before { content: ''; flex: none; width: 10px; height: 10px; border: 2px solid var(--b-line); }
.roll-brutal .cr-subtitle::after { content: ''; flex: 1; height: 2px; background: var(--b-line); box-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
.roll-brutal .cr-title + .cr-subtitle { margin-top: 4px; }
.roll-brutal .cr-names { max-width: none; padding: 0; }
.roll-brutal .cr-name { font-family: 'Outfit', sans-serif; font-weight: 500; color: #fff; letter-spacing: .01em; text-shadow: 0 2px 10px rgba(0, 0, 0, .75); }
.roll-brutal .cr-count { color: var(--b-lilac); font-family: 'Share Tech Mono', monospace; }
.roll-brutal .cr-tag { margin-left: 12px; padding: 1px 9px; background: none; color: var(--b-lilac); border: 2px solid var(--b-lilac); border-radius: 0; box-shadow: none; font-family: 'Share Tech Mono', monospace; font-weight: 400; text-shadow: none; }
.roll-brutal .cr-text { font-family: 'Share Tech Mono', monospace; color: #e6e6e6; text-shadow: 0 2px 10px rgba(0, 0, 0, .7); }
/* testo finale come il titolo iniziale: a blocchi, barretta a sinistra, prima parola in lilla */
.roll-brutal .cr-footer { display: inline-block; padding: 4px 0 4px 26px; border-left: 4px solid var(--b-line); text-align: left; font-family: 'Bungee', 'Arial Black', sans-serif; font-weight: 400; font-size: calc(var(--cr-header-size) * 1.3); line-height: .98; letter-spacing: 0; color: #fff; text-shadow: 0 4px 24px rgba(0, 0, 0, .6); text-transform: uppercase; }
.roll-brutal .cr-footer .w1 { display: block; color: var(--b-lilac); }
.roll-brutal .cr-logo, .roll-brutal .cr-footer-img { border: 2px solid var(--b-line); }
.roll-brutal.fx-glow .cr-name.in, .roll-brutal .fx-glow .cr-name.in { animation: none; }

</style>
</head>
<body>
<div id="stage">
  <canvas id="particles"></canvas>
  <div id="roll-mask"><div id="roll"></div></div>
</div>

<script src="/fonts.js"></script>
<script>
/* =====================================================================
   IMPOSTAZIONI PREDEFINITE
   ===================================================================== */
const DEFAULTS = {
  showSubs: true, showGifts: true, showFollowers: true,
  titleSubs: 'Iscritti', titleSubsPaid: 'Subscribers', titleSubsGifted: 'Gifted',
  titleGifts: 'Sub regalati da', titleFollowers: 'Follower',
  headerText: 'La stream è terminata',
  headerSub: 'Un ringraziamento a tutti gli spettatori che sono passati dal canale,\na chi ha seguito e commentato i miei video su YouTube e,\nin particolare, a chi ha supportato attivamente il canale con sub e gift. ♥',
  footerText: '', footerGap: 20,
  splitSubs: true, includeGiftedInSubs: true, showGiftCount: true, maxFollowers: 200,
  topGifterTag: true, topGifterText: 'Top Gifter',
  excluded: [], // nomi da non mostrare mai (bot, account secondari…)
  speed: 80, startDelay: 0, gap: 3, exitLine: 0, entryLine: 100, columns: 1,
  fetchOnStart: true, fetchEvery: 30,
  musicOn: false, musicFile: '', musicDelay: 2, musicVolume: 0.6, musicLoop: true, musicFade: 3, musicKeep: false,
  fontTitle: "'Cinzel', serif", fontText: "'Inter', sans-serif",
  headerColor: '#ffffff', accentColor: '#9147ff', subColor: '#bf94ff', nameColor: '#e8deff',
  headerSize: 52, titleSize: 22, nameSize: 28, nameShadow: false,
  particles: true, bgColor: '#000000', bgOpacity: 0,
  // sezioni: ordine (abbonati, gift, follower e sezioni aggiunte a mano) e sezioni personalizzate
  order: ['subs', 'gifts', 'followers'], customSections: [],
  // immagini e sfondo
  logoImage: '', logoSize: 320, footerImage: '', footerImageSize: 260,
  bgImage: '', bgImageOpacity: 1, bgFit: 'cover', bgBlur: 0,
  particleColor: '#a050ff', particleCount: 120, particleShape: 'dots', particleSpeed: 1,
  // nomi
  nameAlign: 'center', nameGap: 4, nameWeight: 400, nameUppercase: false, nameSpacing: 0.04, nameEffect: 'none',
  // alla fine dello scorrimento: 'loop' ricomincia, 'stop' si ferma con il testo finale a metà schermo
  endMode: 'loop',
  // stile dell'animazione: 'classic' oppure 'brutal' (Brutalism: nero, bianco e lilla)
  rollTheme: 'classic'
};
// Le impostazioni di una singola sezione si salvano come 'sec.<sezione>.<campo>', es. 'sec.subs.accent'.
const SECTION_STYLE = [
  // campo, variabile CSS, impostazione generale da usare se la sezione non ne ha una sua, unità
  ['accent', '--cr-accent', 'accentColor', ''],
  ['sub', '--cr-sub-color', 'subColor', ''],
  ['name', '--cr-name-color', 'nameColor', ''],
  ['fontTitle', '--cr-font-title', 'fontTitle', ''],
  ['fontText', '--cr-font-text', 'fontText', ''],
  ['titleSize', '--cr-title-size', 'titleSize', 'px'],
  ['nameSize', '--cr-name-size', 'nameSize', 'px'],
  ['columns', '--cr-columns', 'columns', ''],
  ['align', '--cr-name-align', 'nameAlign', ''],
];
const BUILTIN_SECTIONS = { subs: 'Abbonati', gifts: 'Gift', followers: 'Follower' };
// Da dove prende i nomi una sezione aggiunta: solo categorie che Twitch comunica davvero a TwitchGestor.
const CUSTOM_SOURCES = [
  ['Scritti a mano', [['manual', 'Nomi scritti a mano']]],
  ['Da Twitch', [['tier1', 'Abbonati Tier 1'], ['tier2', 'Abbonati Tier 2'], ['tier3', 'Abbonati Tier 3'], ['mods', 'Moderatori'], ['vips', 'VIP'], ['bits', 'Classifica bits'], ['chatters', 'Chi era in chat']]],
  ['Da questa live', [['live.follows', 'Nuovi follower'], ['live.subs', 'Nuovi abbonati'], ['live.resubs', 'Rinnovi abbonamento'], ['live.gifters', 'Chi ha regalato sub'], ['live.cheers', 'Chi ha inviato bits'], ['live.donations', 'Chi ha donato'], ['live.raids', 'Chi ha fatto raid'], ['live.redemptions', 'Chi ha riscattato premi']]],
];
const SOURCE_LABEL = Object.fromEntries(CUSTOM_SOURCES.flatMap(([, list]) => list));
const AMOUNT_SOURCES = ['bits', 'live.resubs', 'live.gifters', 'live.cheers', 'live.donations', 'live.raids', 'live.redemptions'];
const RELOGIN_SOURCES = ['mods', 'vips', 'chatters'];
const SERVER_SOURCES = ['mods', 'vips', 'chatters', 'bits'];
const BITS_PERIODS = [['day', 'Oggi'], ['week', 'Questa settimana'], ['month', 'Questo mese'], ['year', "Quest'anno"], ['all', 'Da sempre']];
const fmtNum = n => Number(n || 0).toLocaleString('it-IT');
const fmtMoney = (v, cur) => { try { return new Intl.NumberFormat('it-IT', { style: 'currency', currency: cur || 'EUR' }).format(v); } catch { return v + ' ' + (cur || ''); } };

/** Nomi (ed eventuale quantità) di una sezione aggiunta, in base alla fonte scelta. */
function customRows(c, d) {
  const session = d.session || {};
  const tier = { tier1: '1000', tier2: '2000', tier3: '3000' }[c.source];
  const byName = (a, b) => a.name.localeCompare(b.name, 'it', { sensitivity: 'base' });
  const names = list => list.map(name => ({ name }));
  switch (c.source || 'manual') {
    case 'manual': return names(String(c.names || '').split('\n').map(n => n.trim()).filter(Boolean));
    case 'tier1': case 'tier2': case 'tier3':
      return names([...new Set((d.subs || []).filter(x => x.tier === tier).map(x => x.name))]).sort(byName);
    case 'mods': return names(d.moderators || []).sort(byName);
    case 'vips': return names(d.vips || []).sort(byName);
    case 'chatters': return names((d.chatters || []).map(x => x.name)).sort(byName);
    case 'bits': return ((d.bits || {})[c.period || 'all'] || []).map(b => ({ name: b.name, amount: fmtNum(b.value) + ' bits' }));
    case 'live.follows': return names(session.follows || []);
    case 'live.subs': return names(session.subs || []);
    case 'live.resubs': return (session.resubs || []).map(r => ({ name: r.name, amount: r.value + (r.value === 1 ? ' mese' : ' mesi') }));
    case 'live.gifters': return (session.gifters || []).map(r => ({ name: r.name, amount: r.value + ' sub' }));
    case 'live.cheers': return (session.cheers || []).map(r => ({ name: r.name, amount: fmtNum(r.value) + ' bits' }));
    case 'live.donations': return (session.donations || []).map(r => ({ name: r.name, amount: fmtMoney(r.value, r.currency) }));
    case 'live.raids': return (session.raids || []).map(r => ({ name: r.name, amount: fmtNum(r.value) + (r.value === 1 ? ' spettatore' : ' spettatori') }));
    case 'live.redemptions': {
      const want = String(c.reward || '').trim().toLowerCase();
      const counts = new Map();
      for (const r of session.redemptions || []) if (!want || r.reward.toLowerCase().includes(want)) counts.set(r.name, (counts.get(r.name) || 0) + 1);
      return [...counts].map(([name, n]) => ({ name, amount: n + '×' }));
    }
    default: return [];
  }
}
const secKey = (id, field) => `sec.${id}.${field}`;

/** Ordine delle sezioni: quello salvato, più le sezioni nuove in fondo. */
function sectionOrder(s) {
  const ids = [...Object.keys(BUILTIN_SECTIONS), ...(s.customSections || []).map(c => c.id)];
  const saved = (s.order || []).filter(id => ids.includes(id));
  return [...saved, ...ids.filter(id => !saved.includes(id))];
}

/** Carica da Google Fonts il primo font indicato (se non è un font generico o di sistema). */
const loadedFonts = new Set();
const GENERIC_FONTS = ['serif', 'sans-serif', 'monospace', 'cursive', 'fantasy', 'system-ui', 'segoe ui', 'arial', 'impact', 'georgia', 'verdana', 'tahoma', 'times new roman', 'courier new', 'comic sans ms'];
function ensureFont(css) {
  const name = String(css || '').split(',')[0].replace(/['"]/g, '').trim();
  if (!name || loadedFonts.has(name) || GENERIC_FONTS.includes(name.toLowerCase())) return;
  loadedFonts.add(name);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(name).replace(/%20/g, '+') + '&display=swap';
  document.head.append(link);
}

// file caricato (media/...), indirizzo web o file in memoria (demo)
function mediaSrc(f) {
  f = String(f || '').trim();
  if (!f) return '';
  return /^[a-z][a-z0-9+.-]*:/i.test(f) ? f : '/' + f.replace(/^\/+/, '');
}

// font del tema Brutalism (titolo a blocchi, etichette monospazio, nomi)
const BRUTAL_FONTS = ["'Bungee'", "'Share Tech Mono'", "'Outfit'"];
const K = { settings: 'settings', data: 'data', cmd: 'cmd', status: 'status' };
const params = new URLSearchParams(location.search);
const MODE = params.has('pannello') ? 'panel' : params.has('anteprima') ? 'preview' : 'live';
const PREVIEW_AUDIO = params.get('audio') === '1';

const sleep = ms => new Promise(r => setTimeout(r, ms));
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* =====================================================================
   DATI CONDIVISI (server di TwitchGestor, vedi src/credits.js)
   Dock e sorgente browser di OBS hanno memorie separate: tutto passa dal
   server. Ogni pagina ne tiene una copia e la riallinea ogni secondo.
   ===================================================================== */
const store = {};
const changeListeners = [];
let rev = 0, pending = 0, writeQ = Promise.resolve();
let account = null, twitchConfigured = true; // account Twitch collegato a TwitchGestor
// Se nella dashboard hai impostato DASHBOARD_TOKEN, aggiungi ?token=... all'indirizzo del dock.
const TOKEN = params.get('token') || (() => { try { return localStorage.getItem('dashboardToken'); } catch { return null; } })();

function api(path, opts = {}) {
  return fetch('/api/credits/' + path, { ...opts, headers: { 'x-twitchgestor': '1', ...(TOKEN ? { 'x-dashboard-token': TOKEN } : {}), ...opts.headers } });
}
function load(k, def) { const v = store[k]; return v == null ? def : structuredClone(v); }
function save(k, v) {
  store[k] = v; pending++;
  writeQ = writeQ.then(() => api('state/' + k, { method: 'PUT', body: JSON.stringify(v ?? null) })).catch(() => {}).finally(() => pending--);
  return writeQ;
}
function onChange(fn) { changeListeners.push(fn); }
function getSettings() { return { ...DEFAULTS, ...load(K.settings, {}) }; }

async function sync() {
  const j = await (await api('state?rev=' + rev)).json();
  // tema della dashboard (scheda Tema): vale anche per questo pannello
  if (MODE === 'panel' && j.ui && document.documentElement.dataset.ui !== j.ui) {
    document.documentElement.dataset.ui = j.ui;
    if (j.ui === 'brutal') BRUTAL_FONTS.forEach(ensureFont);
  }
  if (j.account !== account || j.configured !== twitchConfigured) {
    account = j.account; twitchConfigured = j.configured;
    changeListeners.forEach(fn => fn('account'));
  }
  if (!j.state || pending) return; // nulla di nuovo, o una nostra scrittura è ancora in viaggio
  rev = j.rev;
  const changed = [];
  for (const k of new Set([...Object.keys(store), ...Object.keys(j.state)])) {
    if (JSON.stringify(store[k]) !== JSON.stringify(j.state[k])) { store[k] = j.state[k]; changed.push(k); }
  }
  for (const k of changed) changeListeners.forEach(fn => fn(k));
}

async function boot() {
  let wait = null;
  while (true) {
    try { await sync(); break; }
    catch {
      if (MODE === 'panel' && !wait) {
        document.body.classList.add('panel');
        wait = el('div', 'p-wait', 'In attesa di TwitchGestor… Controlla che il programma sia acceso e che questa pagina sia aperta da http://localhost:3000/credits?pannello');
        document.body.append(wait);
      }
      await sleep(2000);
    }
  }
  if (wait) wait.remove();
  setInterval(() => sync().then(() => document.body.classList.remove('offline'), () => document.body.classList.add('offline')), 1000);
}

/* =====================================================================
   TWITCH: i dati li scarica TwitchGestor con l'account del canale
   (all'avvio, ogni N minuti e dopo ogni follow, sub o gift in live).
   ===================================================================== */
async function fetchData() {
  const r = await api('fetch', { method: 'POST' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Errore ' + r.status);
  if (j.errors && j.errors.length) throw new Error(j.errors.join(' · '));
}

/* =====================================================================
   COSTRUZIONE DELLE CATEGORIE
   Ogni sezione ha uno o più gruppi (es. Subscribers / Gifted).
   ===================================================================== */
const byName = (a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' });
const ANON = 'Anonimo';

const isExcluded = (s, n) => (s.excluded || []).some(e => e.toLowerCase() === String(n).toLowerCase());

function buildSections(s, d) {
  const keep = n => !isExcluded(s, n);
  const subs = (d.subs || []).filter(x => keep(x.name));
  const gifts = new Map();
  for (const x of d.subs || []) if (x.gift) { const g = x.gifter || ANON; if (keep(g)) gifts.set(g, (gifts.get(g) || 0) + 1); }
  const gifters = [...gifts].sort((a, b) => b[1] - a[1] || byName(a[0], b[0]));
  const top = gifters.find(([n]) => n !== ANON);
  const topName = s.topGifterTag && top ? top[0] : '';
  // il Top Gifter (col badge) va in cima alla sua lista, il resto in ordine alfabetico
  const topFirst = names => names.includes(topName) ? [topName, ...names.filter(n => n !== topName)] : names;
  const uniq = list => topFirst([...new Set(list.map(x => x.name))].sort(byName));

  const sections = [];
  if (s.showSubs) {
    const paid = uniq(subs.filter(x => !x.gift));
    const gifted = s.includeGiftedInSubs ? uniq(subs.filter(x => x.gift)) : [];
    const groups = s.splitSubs
      ? [{ title: s.titleSubsPaid, names: paid }, { title: s.titleSubsGifted, names: gifted }]
      : [{ title: '', names: topFirst([...new Set([...paid, ...gifted])].sort(byName)) }];
    sections.push({ key: 'subs', title: s.titleSubs, groups });
  }
  if (s.showGifts) {
    sections.push({ key: 'gifts', title: s.titleGifts, groups: [{ title: '', names: gifters.map(g => g[0]), counts: s.showGiftCount ? gifters.map(g => g[1]) : null }] });
  }
  if (s.showFollowers) {
    const f = (d.followers || []).filter(keep);
    sections.push({ key: 'followers', title: s.titleFollowers, groups: [{ title: '', names: s.maxFollowers > 0 ? f.slice(0, s.maxFollowers) : f }] });
  }
  // sezioni aggiunte a mano (es. Moderatori): nomi scritti nel pannello e testo libero
  for (const c of s.customSections || []) {
    if (c.show === false) continue;
    let rows = customRows(c, d).filter(r => keep(r.name));
    if (c.max > 0) rows = rows.slice(0, c.max);
    const withAmount = c.showAmount && AMOUNT_SOURCES.includes(c.source);
    sections.push({ key: c.id, custom: true, title: c.title || '', text: c.text || '', groups: [{ title: c.subtitle || '', names: rows.map(r => r.name), counts: withAmount ? rows.map(r => r.amount) : null }] });
  }
  const order = sectionOrder(s);
  sections.sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
  return { sections, top: topName };
}

function demoData() {
  const a = ['Luna', 'Drago', 'Pixel', 'Neve', 'Volpe', 'Ombra', 'Razzo', 'Gatto', 'Nebbia', 'Fulmine', 'Orso', 'Tempesta'];
  const b = ['Rossa', '_TV', '92', 'Gamer', 'Nera', 'Lampo', 'XD', 'Zeta', 'Plays', '_it'];
  const nm = i => a[i % a.length] + b[(i * 7) % b.length] + (i > 20 ? i : '');
  const gifters = ['GeneroSO', 'ZioSub', 'Mecenate_', ''];
  const subs = [];
  for (let i = 0; i < 26; i++) {
    const gift = i % 4 === 0;
    subs.push({ name: nm(i), gift, gifter: gift ? gifters[(i / 4) % 4] : '', tier: '1000' });
  }
  subs.push({ name: 'GeneroSO', gift: false, gifter: '', tier: '1000' });
  subs[1].tier = '2000'; subs[5].tier = '2000'; subs[9].tier = '3000';
  const pick = (from, n) => Array.from({ length: n }, (_, i) => nm(from + i));
  return {
    fetchedAt: 0, demo: true, subs, followers: pick(50, 40),
    moderators: ['ModAnna', 'ModLuca', 'Wolfery'], vips: pick(120, 4),
    bits: Object.fromEntries(['day', 'week', 'month', 'year', 'all'].map((p, k) => [p, pick(140, 6).map((name, i) => ({ name, value: (6 - i) * 250 * (k + 1) }))])),
    chatters: pick(200, 25).map(name => ({ name, at: Date.now() })),
    session: {
      live: true, since: new Date(Date.now() - 3 * 3600e3).toISOString(),
      follows: pick(300, 8), subs: pick(320, 3), resubs: pick(330, 3).map((name, i) => ({ name, value: 3 + i * 7 })),
      gifters: [{ name: 'GeneroSO', value: 10 }, { name: 'ZioSub', value: 5 }], cheers: pick(340, 4).map((name, i) => ({ name, value: 1000 - i * 200 })),
      donations: [{ name: 'Mecenate_', value: 50, currency: 'EUR' }, { name: pick(350, 1)[0], value: 5, currency: 'EUR' }],
      raids: [{ name: 'CanaleAmico', value: 42 }],
      redemptions: pick(360, 5).map((name, i) => ({ name, reward: i % 2 ? 'Idratati' : 'Scegli la canzone' })),
    },
  };
}

/* =====================================================================
   TITOLI DI CODA (sorgente OBS e anteprima)
   ===================================================================== */
let particlesOn = true;
let particleCfg = { color: '#a050ff', count: 120, shape: 'dots', speed: 1 };

/** Immagine o video di sfondo, sotto le particelle e i nomi. */
function applyBackground(s) {
  const stage = document.getElementById('stage');
  let media = document.getElementById('bg-media');
  const src = mediaSrc(s.bgImage);
  const isVideo = /\.(webm|mp4)(#|$)/i.test(s.bgImage);
  if (!src) { media?.remove(); return; }
  if (!media || media.dataset.src !== src || (media.tagName === 'VIDEO') !== isVideo) {
    media?.remove();
    media = document.createElement(isVideo ? 'video' : 'img');
    media.id = 'bg-media';
    media.dataset.src = src;
    media.src = src;
    if (isVideo) Object.assign(media, { muted: true, loop: true, autoplay: true, playsInline: true });
    stage.prepend(media);
  }
  media.style.objectFit = s.bgFit;
  media.style.opacity = s.bgImageOpacity;
  media.style.filter = s.bgBlur > 0 ? `blur(${s.bgBlur}px)` : '';
}

function applyStyle(s) {
  const r = document.documentElement.style;
  r.setProperty('--cr-font-title', s.fontTitle);
  r.setProperty('--cr-font-text', s.fontText);
  r.setProperty('--cr-header-color', s.headerColor);
  r.setProperty('--cr-accent', s.accentColor);
  r.setProperty('--cr-glow', s.accentColor + '99');
  r.setProperty('--cr-sub-color', s.subColor);
  r.setProperty('--cr-name-color', s.nameColor);
  r.setProperty('--cr-header-size', s.headerSize + 'px');
  r.setProperty('--cr-title-size', s.titleSize + 'px');
  r.setProperty('--cr-name-size', s.nameSize + 'px');
  r.setProperty('--cr-columns', Math.max(1, Math.min(4, s.columns | 0)));
  r.setProperty('--cr-exit', s.exitLine + '%');
  r.setProperty('--cr-entry', s.entryLine + '%');
  r.setProperty('--cr-name-shadow', s.nameShadow ? '0 3px 10px rgba(0,0,0,.85)' : 'none');
  r.setProperty('--cr-name-align', s.nameAlign);
  r.setProperty('--cr-name-gap', (+s.nameGap || 0) + 'px');
  r.setProperty('--cr-name-weight', s.nameWeight);
  r.setProperty('--cr-name-transform', s.nameUppercase ? 'uppercase' : 'none');
  r.setProperty('--cr-name-spacing', (+s.nameSpacing || 0) + 'em');
  ensureFont(s.fontTitle); ensureFont(s.fontText);
  // tema Brutalism: blocchi pieni, bordi spessi, nero/bianco/lilla (i colori e i font del pannello non contano)
  const brutal = s.rollTheme === 'brutal';
  document.body.classList.toggle('roll-brutal', brutal && MODE !== 'panel');
  if (brutal) BRUTAL_FONTS.forEach(ensureFont);
  applyBackground(s);
  particleCfg = { color: s.particleColor, count: Math.max(0, Math.min(400, s.particleCount | 0)), shape: s.particleShape, speed: +s.particleSpeed || 1 };
  const hex = s.bgColor.replace('#', '');
  const [R, G, B] = [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16) || 0);
  r.setProperty('--cr-bg', `rgba(${R},${G},${B},${s.bgOpacity})`);
  particlesOn = !!s.particles;
}

// la prima parola a parte: nel tema Brutalism va sulla sua riga, in lilla (come "JUST / CHATTING")
function splitFirstWord(text) {
  const [first, ...rest] = String(text).trim().split(/\s+/);
  return rest.length ? [el('span', 'w1', first), ' ', el('span', 'w2', rest.join(' '))] : [el('span', 'w1', first)];
}

function renderRoll(roll, s, d) {
  roll.replaceChildren();
  const subLines = String(s.headerSub || '').split('\n').filter(l => l.trim());
  if (s.headerText || subLines.length || s.logoImage) {
    const h = el('div', 'cr-header');
    if (s.logoImage) {
      const img = el('img', 'cr-logo');
      img.src = mediaSrc(s.logoImage); img.alt = ''; img.style.width = (+s.logoSize || 320) + 'px';
      h.append(img);
    }
    if (s.headerText) {
      const h1 = el('h1');
      h1.append(...splitFirstWord(s.headerText));
      h.append(h1);
    }
    for (const l of subLines) h.append(el('p', null, l));
    roll.append(h);
  }
  const { sections, top } = buildSections(s, d);
  for (const sec of sections) {
    const groups = sec.groups.filter(g => g.names.length);
    if (!groups.length && !sec.text) continue; // le categorie vuote non compaiono
    const box = el('section', 'cr-section cr-' + sec.key);
    // stile personalizzato della sezione: sovrascrive le variabili CSS solo al suo interno
    if (s[secKey(sec.key, 'custom')]) {
      for (const [field, cssVar, , unit] of SECTION_STYLE) {
        const v = s[secKey(sec.key, field)];
        if (v === undefined || v === '') continue;
        box.style.setProperty(cssVar, v + unit);
        if (field.startsWith('font')) ensureFont(v);
      }
    }
    const icon = s[secKey(sec.key, 'icon')];
    if (sec.title) box.append(el('h2', 'cr-title', sec.title));
    if (sec.text) box.append(el('p', 'cr-text', sec.text));
    for (const g of groups) {
      if (g.title) box.append(el('h3', 'cr-subtitle', g.title));
      const list = el('ul', 'cr-names');
      g.names.forEach((n, i) => {
        const li = el('li', 'cr-name');
        if (icon) li.append(el('span', 'cr-icon', icon));
        li.append(n);
        if (g.counts) li.append(el('span', 'cr-count', '(' + g.counts[i] + ')'));
        if (n === top) li.append(el('span', 'cr-tag', '★ ' + s.topGifterText));
        list.append(li);
      });
      box.append(list);
    }
    roll.append(box);
  }
  if (s.footerText) {
    const footer = el('div', 'cr-footer');
    footer.append(...splitFirstWord(s.footerText));
    footer.style.marginTop = Math.max(0, +s.footerGap || 0) + 'px'; // distanza dal resto dei titoli
    roll.append(footer);
  }
  if (s.footerImage) {
    const img = el('img', 'cr-footer-img');
    img.src = mediaSrc(s.footerImage); img.alt = ''; img.style.width = (+s.footerImageSize || 260) + 'px';
    roll.append(img);
  }
}

// particelle luminose viola che salgono lentamente (colori nei addColorStop)
// particelle sullo sfondo: colore, quantità, forma e velocità si scelgono nel pannello
function startParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const fit = () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; };
  fit(); window.addEventListener('resize', fit);
  const make = (anywhere) => ({
    x: Math.random() * canvas.width, y: anywhere ? Math.random() * canvas.height : canvas.height + 10,
    r: Math.random() * 2.5 + 0.8, dx: (Math.random() - 0.5) * 0.2, dy: -(Math.random() * 0.35 + 0.08),
    o: Math.random() * 0.5 + 0.3, pulse: Math.random() * Math.PI * 2, rot: Math.random() * Math.PI
  });
  let pts = [];
  const rgb = hex => { const n = parseInt(String(hex).replace('#', ''), 16) || 0xa050ff; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

  function star(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function heart(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.9);
    ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.5);
    ctx.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
    ctx.closePath();
  }

  (function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cfg = particleCfg;
    while (pts.length < cfg.count) pts.push(make(true));
    if (pts.length > cfg.count) pts = pts.slice(0, cfg.count);
    const [R, G, B] = rgb(cfg.color);
    const snow = cfg.shape === 'snow';
    if (particlesOn) for (const p of pts) {
      p.pulse += 0.018;
      const ao = p.o * (0.7 + 0.3 * Math.sin(p.pulse));
      if (cfg.shape === 'stars' || cfg.shape === 'hearts') {
        ctx.fillStyle = `rgba(${R},${G},${B},${ao.toFixed(2)})`;
        ctx.shadowColor = `rgba(${R},${G},${B},${(ao * 0.8).toFixed(2)})`; ctx.shadowBlur = 8;
        (cfg.shape === 'stars' ? star : heart)(p.x, p.y, p.r * 2.4);
        ctx.fill(); ctx.shadowBlur = 0;
      } else {
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
        grd.addColorStop(0, `rgba(${Math.min(255, R + 60)},${Math.min(255, G + 60)},${Math.min(255, B + 60)},${ao.toFixed(2)})`);
        grd.addColorStop(0.4, `rgba(${R},${G},${B},${(ao * 0.55).toFixed(2)})`);
        grd.addColorStop(1, `rgba(${R},${G},${B},0)`);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); ctx.fillStyle = grd; ctx.fill();
      }
      // la neve scende, le altre forme salgono
      p.x += p.dx * cfg.speed; p.y += (snow ? -p.dy * 1.6 : p.dy) * cfg.speed;
      if (p.y < -10) p.y = canvas.height + 10;
      if (p.y > canvas.height + 10) p.y = -10;
      if (p.x < -10) p.x = canvas.width + 10;
      if (p.x > canvas.width + 10) p.x = -10;
    }
    requestAnimationFrame(draw);
  })();
}

// brano caricato dal pannello (media/music/...) oppure indirizzo web
const musicSrc = mediaSrc;

function startRollPlayer() {
  const stage = document.getElementById('stage');
  const roll = document.getElementById('roll');
  let anim = null, audio = null, fadeRaf = 0, observer = null;
  let timers = [], musicTimers = [];

  function stopMusic() {
    musicTimers.forEach(clearTimeout); musicTimers = [];
    cancelAnimationFrame(fadeRaf);
    if (audio) { audio.pause(); audio.src = ''; audio = null; }
  }
  function fadeOut(sec) {
    if (!audio) return;
    const a = audio, v0 = a.volume, t0 = performance.now();
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / Math.max(1, sec * 1000));
      a.volume = v0 * (1 - k);
      if (k < 1) fadeRaf = requestAnimationFrame(step); else stopMusic();
    };
    fadeRaf = requestAnimationFrame(step);
  }
  // con "continua la musica" il brano non si interrompe (né sfuma) quando lo scorrimento finisce
  const musicPlaying = () => audio && !audio.paused && !audio.ended;
  function startMusic(s, dur) {
    if (!s.musicOn || !s.musicFile) return;
    if (MODE === 'preview' && !PREVIEW_AUDIO) return;
    const delay = Math.max(0, s.musicDelay) * 1000;
    musicTimers.push(setTimeout(() => {
      audio = new Audio(musicSrc(s.musicFile));
      audio.loop = !!s.musicLoop;
      audio.volume = Math.max(0, Math.min(1, s.musicVolume));
      audio.play().catch(e => console.warn('Musica non avviata:', e));
      const fadeAt = dur - delay - s.musicFade * 1000;
      if (!s.musicKeep && s.musicFade > 0 && fadeAt > 0) musicTimers.push(setTimeout(() => fadeOut(s.musicFade), fadeAt));
    }, delay));
  }

  function cycle(first) {
    timers.forEach(clearTimeout); timers = [];
    const s = getSettings();
    // al giro successivo la musica che deve continuare non riparte da capo
    const keepMusic = !first && s.musicKeep && s.musicOn && musicPlaying();
    if (!keepMusic) stopMusic();
    if (anim) anim.cancel();
    applyStyle(s);
    renderRoll(roll, s, load(K.data, {}));
    // effetto di comparsa: ogni nome si anima quando supera la linea di entrata
    observer?.disconnect();
    roll.className = s.nameEffect && s.nameEffect !== 'none' ? 'fx-' + s.nameEffect : '';
    if (roll.className) {
      observer = new IntersectionObserver(entries => {
        for (const e of entries) if (e.isIntersecting) { e.target.classList.add('in'); observer.unobserve(e.target); }
      }, { root: stage, rootMargin: `0px 0px -${100 - s.entryLine}% 0px` });
      roll.querySelectorAll('.cr-name').forEach(n => observer.observe(n));
    }
    requestAnimationFrame(() => {
      const H = stage.clientHeight, h = roll.offsetHeight;
      // i nomi partono dalla linea di entrata e finiscono quando l'ultima riga passa la linea di uscita
      const startY = H * s.entryLine / 100;
      let endY = H * s.exitLine / 100 - h;
      // "fermati sul testo finale": il testo finale (o, se manca, l'ultimo elemento) si ferma a metà schermo
      const last = roll.querySelector('.cr-footer') || roll.lastElementChild;
      const stop = s.endMode === 'stop' && last;
      if (stop) endY = H / 2 - (last.offsetTop + last.offsetHeight / 2);
      const dur = (startY - endY) / Math.max(5, s.speed) * 1000;
      window.crDuration = dur; // letto dal pannello per mostrare la durata di un giro
      // attesa prima che arrivino i nomi: solo al primo giro (avvio o "Riavvia"), poi conta la pausa
      const wait = first ? Math.max(0, s.startDelay) * 1000 : 0;
      if (anim) anim.cancel(); // due riavvii ravvicinati non devono lasciare un'animazione vecchia attiva
      anim = roll.animate([{ transform: `translateY(${startY}px)` }, { transform: `translateY(${endY}px)` }], { duration: dur, delay: wait, easing: 'linear', fill: 'both' });
      if (!keepMusic) startMusic(s, wait + dur);
      anim.onfinish = () => {
        if (stop) { if (!s.musicKeep && !(s.musicFade > 0)) stopMusic(); return; } // resta fermo finché non si riavvia
        if (!s.musicKeep) stopMusic();
        timers.push(setTimeout(() => cycle(false), Math.max(0, s.gap) * 1000));
      };
    });
  }

  let restartT = 0;
  const restartSoon = () => { clearTimeout(restartT); restartT = setTimeout(() => cycle(true), 300); };

  onChange(k => {
    if (k === K.settings) { applyStyle(getSettings()); if (MODE === 'preview') restartSoon(); }
    if (k === K.data && MODE === 'preview') restartSoon();
    if (k === K.cmd && load(K.cmd, {}).type === 'restart') restartSoon();
  });

  startParticles();
  // i font arrivano da Google Fonts: aspetta che siano pronti prima di misurare l'altezza
  document.fonts.ready.then(() => cycle(true));
}
