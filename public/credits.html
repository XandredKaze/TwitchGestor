/* =====================================================================
   SELETTORE DEI FONT
   Sostituisce i campi di testo dei font: elenco con anteprima, ricerca e categorie.
   Il valore resta nel campo nascosto [data-k], così si salva come tutti gli altri.
   ===================================================================== */
const FP_CATS = [['all', 'Tutti'], ['sans', 'Moderni'], ['serif', 'Eleganti'], ['display', 'Decorativi'], ['hand', 'Scritti a mano'], ['mono', 'Monospazio'], ['system', 'Di sistema']];
const FP_CAT_LABEL = Object.fromEntries(FP_CATS);
const previewLoaded = new Set();
const fontName = css => String(css || '').split(',')[0].replace(/['"]/g, '').trim();

// Per l'anteprima scarica solo le lettere del nome del font: pochi byte per font.
function loadFontPreview(name) {
  if (previewLoaded.has(name) || loadedFonts.has(name)) return;
  previewLoaded.add(name);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(name).replace(/%20/g, '+') + '&text=' + encodeURIComponent([...new Set(name)].join('')) + '&display=swap';
  document.head.append(link);
}

function allFonts() {
  return [...(window.FONT_CATALOG || []), ...(window.SYSTEM_FONTS || []).map(name => ({ name, cat: 'system' }))];
}

function fontCss(name) {
  const f = allFonts().find(x => x.name.toLowerCase() === name.toLowerCase());
  const fallback = (window.FONT_FALLBACK || {})[f ? f.cat : 'sans'] || 'sans-serif';
  return `'${name.replace(/'/g, '')}', ${fallback}`;
}

let openPicker = null;
document.addEventListener('pointerdown', e => { if (openPicker && !openPicker.contains(e.target)) openPicker.close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openPicker) openPicker.close(); });

function attachFontPicker(input) {
  if (input._picker) return;
  input.hidden = true;
  input.removeAttribute('list');
  const wrap = el('div', 'fp');
  const btn = el('button', 'fp-btn'); btn.type = 'button';
  const cur = el('span', 'fp-cur'); const caret = el('span', 'fp-caret', 'Cambia ▾');
  btn.append(cur, caret);
  const pop = el('div', 'fp-pop'); pop.hidden = true;
  const search = el('input'); search.type = 'text'; search.placeholder = 'Cerca un font…'; search.setAttribute('aria-label', 'Cerca un font');
  const cats = el('div', 'fp-cats');
  const list = el('div', 'fp-list'); list.setAttribute('role', 'listbox');
  const count = el('div', 'fp-count');
  const custom = el('form', 'fp-custom');
  const customIn = el('input'); customIn.type = 'text'; customIn.placeholder = 'Altro font di Google Fonts (nome esatto)';
  const customBtn = el('button', 'sec', 'Usa'); customBtn.type = 'submit';
  custom.append(customIn, customBtn);
  pop.append(search, cats, list, count, custom);
  wrap.append(btn, pop);
  input.after(wrap);

  let cat = 'all';
  const observer = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) { loadFontPreview(e.target.dataset.font); observer.unobserve(e.target); }
  }, { root: list, rootMargin: '120px' });

  function current() { return fontName(input.value); }
  function refresh() {
    const name = current() || 'Predefinito';
    cur.textContent = name;
    cur.style.fontFamily = input.value || '';
    if (name !== 'Predefinito') ensureFont(input.value);
  }
  function choose(css) {
    input.value = css;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    refresh();
    close();
  }
  function renderList() {
    const q = search.value.trim().toLowerCase();
    const items = allFonts().filter(f => (cat === 'all' || f.cat === cat) && (!q || f.name.toLowerCase().includes(q)));
    observer.disconnect();
    list.replaceChildren(...items.map(f => {
      const b = el('button'); b.type = 'button'; b.dataset.font = f.name; b.setAttribute('role', 'option');
      const n = el('span', null, f.name); n.style.fontFamily = `'${f.name}', ${(window.FONT_FALLBACK || {})[f.cat] || 'sans-serif'}`;
      b.append(n, el('small', null, FP_CAT_LABEL[f.cat] || ''));
      if (f.name.toLowerCase() === current().toLowerCase()) b.classList.add('sel');
      b.onclick = () => choose(fontCss(f.name));
      if (f.cat !== 'system') observer.observe(b);
      return b;
    }));
    count.textContent = items.length ? `${items.length} font` : 'Nessun font trovato: prova a scriverne il nome qui sotto.';
  }
  cats.append(...FP_CATS.map(([key, label]) => {
    const b = el('button', key === 'all' ? 'on' : '', label); b.type = 'button';
    b.onclick = () => { cat = key; cats.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderList(); };
    return b;
  }));
  function open() {
    openPicker?.close();
    pop.hidden = false; openPicker = wrap;
    search.value = ''; renderList();
    list.querySelector('.sel')?.scrollIntoView({ block: 'center' });
    search.focus();
  }
  function close() { pop.hidden = true; if (openPicker === wrap) openPicker = null; }
  wrap.close = close;
  btn.onclick = () => (pop.hidden ? open() : close());
  search.oninput = renderList;
  search.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); list.querySelector('button')?.click(); } };
  custom.onsubmit = e => { e.preventDefault(); const n = customIn.value.trim().replace(/['"]/g, ''); if (n) choose(fontCss(n)); customIn.value = ''; };
  input._picker = wrap;
  input._refresh = refresh;
  refresh();
}

/**
 * Conferma dentro la pagina: il primo clic chiede conferma sul pulsante stesso, il secondo esegue.
 * Le finestre confirm() del browser non funzionano nei dock di OBS (vengono chiuse da sole).
 */
function confirmClick(button, action, question = 'Clicca di nuovo per confermare') {
  const original = button.textContent;
  let timer = 0;
  button.addEventListener('click', e => {
    e.preventDefault();
    if (button.classList.contains('armed')) {
      clearTimeout(timer);
      button.classList.remove('armed'); button.textContent = original;
      action();
      return;
    }
    button.classList.add('armed'); button.textContent = question;
    timer = setTimeout(() => { button.classList.remove('armed'); button.textContent = original; }, 4000);
  });
}

function startPanel() {
  document.body.classList.add('panel');
  document.body.insertAdjacentHTML('beforeend', panelHTML());
  const $ = id => document.getElementById(id);
  // tema Brutalism della dashboard: l'ultima parola dei titoli dei riquadri in lilla ("// STREAM ALERTS")
  document.querySelectorAll('.p-card > h2, .p-brand h1').forEach(h => {
    const m = /^(.*\s)?(\S+)\s*$/s.exec(h.textContent);
    if (m) h.replaceChildren(m[1] ?? '', el('span', 'p-hl', m[2]));
  });
  const fmtTime = t => new Date(t).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const setStatus = (node, msg, kind) => { node.textContent = msg || ''; node.className = 'p-status' + (kind ? ' ' + kind : ''); };

  // --- impostazioni collegate ai campi
  const inputs = () => [...document.querySelectorAll('[data-k]')];
  // data-fallback: se il campo non ha un valore suo mostra quello generale (stile delle singole sezioni)
  function fillInputs() {
    const s = getSettings();
    for (const i of inputs()) {
      let v = s[i.dataset.k];
      if ((v === undefined || v === '') && i.dataset.fallback) v = s[i.dataset.fallback];
      if (i.type === 'checkbox') i.checked = !!v; else i.value = v ?? '';
      i._refresh?.();
    }
  }
  const attachPickers = () => document.querySelectorAll('input[list="cr-fonts"]').forEach(attachFontPicker);
  function bindInputs() {
    for (const i of inputs()) {
      if (i.dataset.bound) continue;
      i.dataset.bound = '1';
      i.addEventListener(i.type === 'checkbox' ? 'change' : 'input', () => {
        const s = load(K.settings, {});
        const k = i.dataset.k;
        if (i.type === 'checkbox') s[k] = i.checked;
        else if (i.type === 'number' || i.type === 'range') { const n = parseFloat(i.value); if (isNaN(n)) return; s[k] = n; }
        else s[k] = i.value;
        save(K.settings, s);
        // la stessa impostazione può comparire in due riquadri (es. "Alla fine"): li tengo allineati
        for (const o of inputs()) if (o !== i && o.dataset.k === k) { if (o.type === 'checkbox') o.checked = i.checked; else o.value = i.value; }
        renderCategories();
        if (k.startsWith('sec.') || k.startsWith('title') || k.startsWith('show')) renderSections();
        if (k.endsWith('.custom')) fillInputs();
      });
    }
  }
  bindInputs();
  attachPickers();
  fillInputs();

  // --- immagini: caricate in TwitchGestor (data/media/images) o indirizzo web
  let uploadTarget = null;
  for (const b of document.querySelectorAll('[data-upload]')) b.onclick = () => { uploadTarget = b.dataset.upload; $('image-input').click(); };
  for (const b of document.querySelectorAll('[data-clear]')) b.onclick = () => { const st = load(K.settings, {}); st[b.dataset.clear] = ''; save(K.settings, st); fillInputs(); };
  $('image-input').onchange = async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file || !uploadTarget) return;
    setStatus($('image-status'), 'Carico ' + file.name + '…');
    try {
      const r = await fetch('/api/upload?kind=images', { method: 'POST', body: file, headers: { 'x-twitchgestor': '1', 'x-filename': encodeURIComponent(file.name), ...(TOKEN ? { 'x-dashboard-token': TOKEN } : {}) } });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'errore ' + r.status);
      const st = load(K.settings, {}); st[uploadTarget] = j.path; save(K.settings, st); fillInputs();
      setStatus($('image-status'), 'Immagine pronta: ' + file.name, 'ok');
    } catch (err) {
      setStatus($('image-status'), 'Caricamento non riuscito: ' + err.message, 'err');
    }
  };

  // --- sezioni: ordine, sezioni aggiunte a mano e stile di ogni sezione
  const SHOW_KEY = { subs: 'showSubs', gifts: 'showGifts', followers: 'showFollowers' };
  const TITLE_KEY = { subs: 'titleSubs', gifts: 'titleGifts', followers: 'titleFollowers' };
  let selectedSec = 'subs';
  const customOf = (s, id) => (s.customSections || []).find(c => c.id === id);
  const secLabel = (s, id) => { const c = customOf(s, id); return c ? (c.title || 'Sezione senza titolo') : (s[TITLE_KEY[id]] || BUILTIN_SECTIONS[id]); };
  function updateSettings(fn) { const st = { ...load(K.settings, {}) }; fn(st, { ...DEFAULTS, ...st }); save(K.settings, st); renderCategories(); renderSections(); }

  function deleteSection(id) {
    updateSettings(st => {
      st.customSections = (st.customSections || []).filter(x => x.id !== id);
      st.order = (st.order || []).filter(x => x !== id);
      for (const k of Object.keys(st)) if (k.startsWith('sec.' + id + '.')) delete st[k];
    });
    renderSectionEditor();
  }

  function renderSections() {
    const s = getSettings();
    const order = sectionOrder(s);
    if (!order.includes(selectedSec)) selectedSec = order[0];
    $('sec-list').replaceChildren(...order.map((id, idx) => {
      const c = customOf(s, id);
      const row = el('div', 'p-sec' + (id === selectedSec ? ' sel' : ''));
      const arrow = (txt, dir, label) => {
        const b = el('button', 'arrow', txt); b.type = 'button'; b.title = label;
        b.disabled = dir < 0 ? idx === 0 : idx === order.length - 1;
        b.onclick = () => updateSettings((st, full) => {
          const o = sectionOrder(full); const j = idx + dir;
          [o[idx], o[j]] = [o[j], o[idx]]; st.order = o;
        });
        return b;
      };
      const name = el('button', 'name'); name.type = 'button';
      name.append(el('span', 'nm', secLabel(s, id)));
      const info = [c ? ((c.source || 'manual') === 'manual' ? 'scritta a mano' : c.source.startsWith('live.') ? 'dalla live' : 'da Twitch') : 'predefinita'];
      if (s[secKey(id, 'custom')]) info.push('stile proprio');
      name.append(el('small', null, info.join(' · ')));
      name.onclick = () => { selectedSec = id; renderSections(); renderSectionEditor(); };
      const show = el('input'); show.type = 'checkbox'; show.setAttribute('aria-label', 'Mostra la sezione');
      show.checked = c ? c.show !== false : !!s[SHOW_KEY[id]];
      show.title = 'Mostra o nascondi nei titoli di coda';
      show.onchange = () => updateSettings(st => {
        if (c) st.customSections = (st.customSections || []).map(x => x.id === id ? { ...x, show: show.checked } : x);
        else st[SHOW_KEY[id]] = show.checked;
      });
      row.append(arrow('↑', -1, 'Sposta su'), arrow('↓', 1, 'Sposta giù'), name, show);
      return row;
    }));
  }

  function field(label, input) { const f = el('div', 'p-field'); f.append(el('label', null, label), input); return f; }
  function rowField(label, input) { const r = el('div', 'p-row'); r.append(el('label', null, label), input); return r; }
  function inputFor(type, key, attrs = {}) {
    const i = el(type === 'select' ? 'select' : 'input');
    if (type !== 'select') i.type = type;
    i.dataset.k = key;
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'options') for (const [val, txt] of v) { const o = el('option', null, txt); o.value = val; i.append(o); }
      else if (k === 'fallback') i.dataset.fallback = v;
      else i.setAttribute(k, v);
    }
    return i;
  }

  function mini(label, input) { const f = el('div', 'p-mini'); f.append(el('label', null, label), input); return f; }

  function renderSectionEditor() {
    const s = getSettings();
    const id = selectedSec;
    const c = customOf(s, id);
    const box = $('sec-editor');

    // Intestazione: nome della sezione, da dove arrivano i nomi, pulsante per eliminarla
    const head = el('div', 'p-ed-head');
    const titleWrap = el('h3');
    titleWrap.append(el('span', 'p-ed-kicker', c ? 'Sezione aggiunta' : 'Sezione predefinita'), document.createTextNode(secLabel(s, id)));
    head.append(titleWrap);
    if (c) head.append(el('span', 'p-tag', (c.source || 'manual') === 'manual' ? 'a mano' : c.source.startsWith('live.') ? 'dalla live' : 'da Twitch'));
    box.replaceChildren(head);

    const content = el('div', 'p-group');
    content.append(el('div', 'p-sub', 'Contenuto'));
    if (c) {
      const edit = (prop, node) => {
        if (node.tagName === 'INPUT') node.type = 'text';
        node.value = c[prop] || '';
        node.oninput = () => {
          const st = load(K.settings, {});
          st.customSections = (st.customSections || []).map(x => x.id === id ? { ...x, [prop]: node.value } : x);
          save(K.settings, st); renderCategories();
          if (prop === 'title') { renderSections(); head.querySelector('h3').lastChild.textContent = node.value || 'Sezione senza titolo'; }
        };
        return node;
      };
      const ta = rows => { const t = el('textarea'); t.rows = rows; return t; };
      const patch = (changes, rerender) => {
        const st = load(K.settings, {});
        st.customSections = (st.customSections || []).map(x => x.id === id ? { ...x, ...changes } : x);
        save(K.settings, st); renderCategories(); renderSections();
        if (rerender) renderSectionEditor();
      };
      const source = c.source || 'manual';

      // da dove prendere i nomi
      const srcSel = el('select');
      for (const [group, list] of CUSTOM_SOURCES) {
        const og = el('optgroup'); og.label = group;
        for (const [val, label] of list) { const o = el('option', null, label); o.value = val; og.append(o); }
        srcSel.append(og);
      }
      srcSel.value = source;
      srcSel.onchange = () => {
        const next = srcSel.value;
        const autoTitle = !c.title || c.title === 'Nuova sezione' || Object.values(SOURCE_LABEL).includes(c.title);
        patch({ source: next, ...(autoTitle ? { title: SOURCE_LABEL[next] } : {}) }, true);
        if (SERVER_SOURCES.includes(next)) fetchData().catch(() => {}); // scarica subito i nomi che servono
      };

      const grid = el('div', 'p-grid2');
      grid.append(field('Titolo', edit('title', el('input'))), field('Sottotitolo (facoltativo)', edit('subtitle', el('input'))));
      content.append(field('Da dove prendere i nomi', srcSel), grid);

      if (source === 'manual') {
        const names = edit('names', ta(6));
        names.placeholder = 'Un nome per riga';
        content.append(field('Nomi', names));
      }
      if (source === 'bits') {
        const per = el('select');
        for (const [val, label] of BITS_PERIODS) { const o = el('option', null, label); o.value = val; per.append(o); }
        per.value = c.period || 'all';
        per.onchange = () => { patch({ period: per.value }); fetchData().catch(() => {}); };
        content.append(rowField('Periodo della classifica', per));
      }
      if (source === 'live.redemptions') content.append(field('Solo questo premio (facoltativo, es. Idratati)', edit('reward', el('input'))));
      if (AMOUNT_SOURCES.includes(source)) {
        const amt = el('input'); amt.type = 'checkbox'; amt.checked = !!c.showAmount;
        amt.onchange = () => patch({ showAmount: amt.checked });
        content.append(rowField('Mostra la quantità accanto ai nomi', amt));
      }
      if (source !== 'manual') {
        const max = el('input'); max.type = 'number'; max.min = 0; max.step = 1; max.value = c.max || 0;
        max.oninput = () => patch({ max: Math.max(0, parseInt(max.value, 10) || 0) });
        content.append(rowField('Numero massimo di nomi (0 = tutti)', max));
      }
      const hint = {
        tier1: 'Gli abbonamenti Prime contano come Tier 1: Twitch non li distingue.',
        mods: 'Serve un nuovo accesso a Twitch (esci e accedi di nuovo dalla dashboard) la prima volta.',
        vips: 'Serve un nuovo accesso a Twitch (esci e accedi di nuovo dalla dashboard) la prima volta.',
        chatters: 'Twitch dice solo chi è collegato alla chat in quel momento: TwitchGestor controlla ogni 5 minuti e ricorda chi è passato nelle ultime 12 ore. Chi guarda senza entrare in chat non si può sapere. La prima volta serve un nuovo accesso a Twitch.',
        bits: 'Classifica ufficiale dei bits del canale, scaricata da Twitch.',
      }[source] || (source.startsWith('live.') ? 'Conta gli eventi arrivati a TwitchGestor dall\'inizio della live in corso (se non sei in live, le ultime 12 ore). Gli alert di prova non contano.' : '');
      if (hint) content.append(el('p', 'p-hint', hint));
      const free = edit('text', ta(3));
      free.placeholder = 'Es. un ringraziamento speciale';
      content.append(field('Testo sotto il titolo (facoltativo)', free));
      const del = el('button', 'danger', '🗑 Elimina'); del.type = 'button'; del.title = 'Elimina questa sezione';
      confirmClick(del, () => deleteSection(id), 'Sicuro? Clicca ancora');
      head.append(del);
    } else {
      content.append(field('Titolo della sezione', inputFor('text', TITLE_KEY[id])));
    }

    // Stile: l'icona vale sempre, il resto solo con "stile personalizzato"
    const style = el('div', 'p-group');
    style.append(el('div', 'p-sub', 'Stile'));
    style.append(rowField('Icona prima di ogni nome (es. ⭐ 🛡️ 💜)', inputFor('text', secKey(id, 'icon'), { maxlength: 8, placeholder: 'nessuna', style: 'width:110px;text-align:center' })));
    const toggle = inputFor('checkbox', secKey(id, 'custom'));
    const sw = el('div', 'p-switch-row');
    const swText = el('div');
    swText.append(el('b', null, 'Stile personalizzato'), el('span', null, 'Colori, dimensioni e font solo per questa sezione. Se è spento usa quelli generali.'));
    sw.append(swText, toggle);
    style.append(sw);
    const custom = el('div', 'p-style-custom');
    const g = el('div', 'p-style-grid');
    g.append(
      mini('Colore titolo e linee', inputFor('color', secKey(id, 'accent'), { fallback: 'accentColor' })),
      mini('Colore sottotitolo', inputFor('color', secKey(id, 'sub'), { fallback: 'subColor' })),
      mini('Colore nomi', inputFor('color', secKey(id, 'name'), { fallback: 'nameColor' })),
      mini('Colonne', inputFor('number', secKey(id, 'columns'), { min: 1, max: 4, step: 1, fallback: 'columns' })),
      mini('Dimensione titolo', inputFor('number', secKey(id, 'titleSize'), { min: 10, step: 2, fallback: 'titleSize' })),
      mini('Dimensione nomi', inputFor('number', secKey(id, 'nameSize'), { min: 10, step: 2, fallback: 'nameSize' })),
      mini('Allineamento', inputFor('select', secKey(id, 'align'), { fallback: 'nameAlign', options: [['center', 'Al centro'], ['left', 'A sinistra'], ['right', 'A destra']] })),
    );
    const fonts = el('div', 'p-grid2');
    fonts.style.marginTop = '12px';
    fonts.append(
      field('Font del titolo', inputFor('text', secKey(id, 'fontTitle'), { list: 'cr-fonts', fallback: 'fontTitle' })),
      field('Font dei nomi', inputFor('text', secKey(id, 'fontText'), { list: 'cr-fonts', fallback: 'fontText' })));
    custom.append(g, fonts);
    style.append(custom);
    box.append(content, style);
    const syncCustom = () => custom.classList.toggle('off', !toggle.checked);
    toggle.addEventListener('change', syncCustom);
    bindInputs();
    attachPickers();
    fillInputs();
    syncCustom();
  }

  $('btn-add-section').onclick = () => {
    const id = 'c' + Date.now().toString(36);
    updateSettings((st, full) => {
      st.customSections = [...(st.customSections || []), { id, title: 'Nuova sezione', source: 'manual', subtitle: '', names: '', text: '', show: true }];
      st.order = [...sectionOrder(full), id];
    });
    selectedSec = id;
    renderSections(); renderSectionEditor();
  };
  renderSections();
  renderSectionEditor();
  confirmClick($('btn-reset'), () => { save(K.settings, {}); fillInputs(); renderCategories(); showLines(readLines()); renderSections(); renderSectionEditor(); },
    'Clicca di nuovo: tolgo anche le sezioni aggiunte');
  // dentro la dashboard di TwitchGestor l'intestazione del pannello è già nella scheda
  if (window.self !== window.top) document.body.classList.add('embedded');

  // --- nomi esclusi: clic su un nome per toglierlo o rimetterlo
  function toggleExcluded(name) {
    const st = load(K.settings, {});
    const ex = st.excluded || [];
    st.excluded = isExcluded(st, name) ? ex.filter(e => e.toLowerCase() !== name.toLowerCase()) : [...ex, name];
    save(K.settings, st);
    renderCategories();
  }
  function nameChip(name, label, cls) {
    const b = el('button', cls, label);
    b.type = 'button';
    b.title = (isExcluded(getSettings(), name) ? 'Rimetti ' : 'Escludi ') + name;
    b.onclick = () => toggleExcluded(name);
    return b;
  }
  function nameRow(name, count, isTop) {
    const b = el('button', 'p-item' + (isTop ? ' top' : ''));
    b.type = 'button';
    b.title = 'Escludi ' + name;
    b.append(el('span', 'n', (isTop ? '★ ' : '') + name));
    if (count) b.append(el('span', 'c', typeof count === 'number' ? '×' + count : count));
    b.append(el('span', 'x', '✕'));
    b.onclick = () => toggleExcluded(name);
    return b;
  }

  // --- anteprima categorie
  function renderCategories() {
    const s = getSettings(), d = load(K.data, {});
    const exBox = $('excluded'); exBox.replaceChildren();
    for (const n of [...s.excluded].sort(byName)) exBox.append(nameChip(n, n, 'p-chip'));
    $('excluded-box').hidden = !s.excluded.length;
    const box = $('cat-preview'); box.replaceChildren();
    const on = { subs: s.showSubs, gifts: s.showGifts, followers: s.showFollowers };
    const { sections, top } = buildSections({ ...s, showSubs: true, showGifts: true, showFollowers: true }, d);
    // una colonna per ogni elenco (Subscribers, Gifted, Sub regalati da, Follower)
    for (const sec of sections) {
      if (sec.custom) on[sec.key] = true;
      if ($('n-' + sec.key)) {
        $('n-' + sec.key).textContent = sec.groups.reduce((n, g) => n + g.names.length, 0);
        $('tile-' + sec.key).classList.toggle('off', !on[sec.key]);
      }
      for (const g of sec.groups) {
        const col = el('div', 'p-col' + (on[sec.key] ? '' : ' off'));
        col.append(el('div', 'p-col-sec', [g.title && sec.title, !on[sec.key] && 'nascosta'].filter(Boolean).join(' · ')));
        const head = el('div', 'p-col-head');
        head.append(el('span', 'p-col-title', g.title || sec.title), el('span', 'p-col-count', g.names.length));
        col.append(head);
        const list = el('div', 'p-list');
        if (!g.names.length) list.append(el('div', 'p-empty', 'Nessun nome'));
        g.names.slice(0, 300).forEach((n, i) => list.append(nameRow(n, g.counts && g.counts[i], n === top)));
        if (g.names.length > 300) list.append(el('div', 'p-empty', `…e altri ${g.names.length - 300}`));
        col.append(list);
        box.append(col);
      }
    }
    const st = load(K.status, null);
    const msg = d.demo ? 'Stai vedendo nomi di prova.' : d.fetchedAt ? 'Ultimo aggiornamento: ' + fmtTime(d.fetchedAt) : 'Nessun dato scaricato.';
    if (st && st.error) setStatus($('fetch-status'), msg + ' Ultimo errore (' + fmtTime(st.at) + '): ' + st.error, 'err');
    else setStatus($('fetch-status'), msg, d.fetchedAt ? 'ok' : '');
    $('pill-upd').textContent = d.demo ? 'Nomi di prova' : d.fetchedAt ? 'Aggiornato ' + fmtTime(d.fetchedAt) : 'Nessun dato';
    $('pill-upd').className = 'p-pill' + (st && st.error ? ' err' : d.fetchedAt ? ' ok' : '');
  }
  renderCategories();

  // --- account (quello di TwitchGestor)
  function renderAccount() {
    const on = !!account;
    $('acc-avatar').textContent = on ? account[0] : '?';
    $('acc-text').replaceChildren(...(on ? ['Collegato come', el('br'), el('b', null, account)] : [twitchConfigured ? 'Nessun account collegato' : 'Twitch non configurato']));
    $('pill-acc').textContent = on ? 'Twitch: ' + account : 'Non collegato';
    $('pill-acc').className = 'p-pill' + (on ? ' ok' : ' err');
    setStatus($('acc-status'), on ? '' : 'Apri la dashboard di TwitchGestor (http://localhost:3000/dashboard) e clicca "Accedi con Twitch".', on ? '' : 'err');
  }
  renderAccount();

  // --- dati
  $('btn-fetch').onclick = async () => {
    $('btn-fetch').disabled = true;
    setStatus($('fetch-status'), 'Scarico i dati da Twitch…');
    try { await fetchData(); } catch (e) { save(K.status, { at: Date.now(), error: e.message }); }
    $('btn-fetch').disabled = false;
    renderCategories(); renderAccount();
  };
  $('btn-demo').onclick = () => { save(K.data, demoData()); save(K.status, null); renderCategories(); };

  // --- anteprima animazione
  const frame = $('preview'), pbox = $('preview-box');
  const base = location.href.split(/[?#]/)[0];
  function loadPreview() { frame.src = base + '?anteprima' + ($('preview-audio').checked ? '&audio=1' : '') + '&t=' + Date.now(); }
  new ResizeObserver(() => { frame.style.transform = `scale(${pbox.clientWidth / 1920})`; }).observe(pbox);
  loadPreview();
  $('btn-restart-preview').onclick = loadPreview;
  $('preview-audio').onchange = loadPreview;
  $('btn-restart-live').onclick = () => save(K.cmd, { type: 'restart', at: Date.now() });

  // --- linee di uscita (in alto) e di entrata (in basso): due pallini sul cursore accanto all'anteprima
  const MIN_GAP = 10; // spazio minimo tra le due linee, in % dello schermo
  const slider = $('line-slider');
  const thumbs = { exitLine: $('exit-thumb'), entryLine: $('entry-thumb') };
  const readLines = () => { const s = getSettings(); return { exitLine: s.exitLine, entryLine: s.entryLine }; };
  // la linea di uscita resta sopra quella di entrata
  function clampLine(v, k, pct) {
    return k === 'exitLine' ? Math.max(0, Math.min(v.entryLine - MIN_GAP, pct)) : Math.min(100, Math.max(v.exitLine + MIN_GAP, pct));
  }
  function showLines(v) {
    for (const k in thumbs) { thumbs[k].style.top = v[k] + '%'; thumbs[k].setAttribute('aria-valuenow', v[k]); }
    $('exit-guide').style.top = v.exitLine + '%';
    $('entry-guide').style.top = v.entryLine + '%';
    $('line-range').style.top = v.exitLine + '%';
    $('line-range').style.bottom = (100 - v.entryLine) + '%';
    const out = v.exitLine === 0 ? 'escono dal bordo alto' : `spariscono al ${v.exitLine}%`;
    const inn = v.entryLine === 100 ? 'entrano dal bordo basso' : `compaiono al ${v.entryLine}%`;
    $('lines-hint').textContent = `I nomi ${inn} e ${out} dello schermo. Trascina i pallini a destra dell'anteprima per cambiarlo.`;
  }
  function saveLines(v) {
    const st = load(K.settings, {});
    st.exitLine = v.exitLine; st.entryLine = v.entryLine;
    save(K.settings, st);
  }
  const pctAt = y => { const r = slider.getBoundingClientRect(); return Math.round(Math.max(0, Math.min(100, (y - r.top) / r.height * 100))); };
  let drag = null; // { k: linea trascinata, v: valori durante il trascinamento }
  slider.addEventListener('pointerdown', e => {
    const v = readLines(), pct = pctAt(e.clientY);
    // muove il pallino più vicino al punto cliccato
    const k = Math.abs(pct - v.exitLine) <= Math.abs(pct - v.entryLine) ? 'exitLine' : 'entryLine';
    slider.setPointerCapture(e.pointerId);
    drag = { k, v };
    v[k] = clampLine(v, k, pct);
    showLines(v); thumbs[k].focus();
    e.preventDefault();
  });
  slider.addEventListener('pointermove', e => { if (drag) { drag.v[drag.k] = clampLine(drag.v, drag.k, pctAt(e.clientY)); showLines(drag.v); } });
  // salva solo al rilascio: l'anteprima riparte una volta sola
  slider.addEventListener('pointerup', () => { if (drag) saveLines(drag.v); drag = null; });
  for (const k in thumbs) thumbs[k].addEventListener('keydown', e => {
    const step = { ArrowUp: -1, ArrowDown: 1, PageUp: -10, PageDown: 10 }[e.key];
    if (!step) return;
    e.preventDefault();
    const v = readLines();
    v[k] = clampLine(v, k, v[k] + step * (e.shiftKey ? 5 : 1));
    showLines(v); saveLines(v);
  });
  showLines(readLines());
  onChange(k => { if (k === K.settings && !drag) showLines(readLines()); });

  // durata di un giro: calcolata dall'anteprima (stessa altezza dell'overlay 1920×1080)
  setInterval(() => {
    const ms = frame.contentWindow && frame.contentWindow.crDuration;
    if (!ms) return;
    const sec = Math.round(ms / 1000);
    const dur = sec >= 60 ? `${Math.floor(sec / 60)} min ${sec % 60} s` : `${sec} s`;
    $('speed-hint').textContent = `Con i nomi attuali lo scorrimento dura circa ${dur}.`;
  }, 1000);

  // --- brano trascinato o scelto: il server lo copia nella cartella e lo imposta
  async function uploadMusic(file) {
    if (!file) return;
    setStatus($('music-status'), 'Copio ' + file.name + ' nella cartella…');
    try {
      const r = await api('upload/' + encodeURIComponent(file.name), { method: 'PUT', body: file });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'errore ' + r.status);
      const st = load(K.settings, {});
      st.musicFile = j.name; st.musicOn = true;
      save(K.settings, st); fillInputs();
      setStatus($('music-status'), 'Brano pronto e musica attivata: ' + j.name, 'ok');
    } catch (e) {
      setStatus($('music-status'), 'Copia non riuscita: ' + e.message, 'err');
    }
  }
  const drop = $('music-drop');
  // un file lasciato fuori dalla zona non deve far aprire il brano al posto del pannello
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => e.preventDefault());
  drop.addEventListener('dragover', () => drop.classList.add('over'));
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { drop.classList.remove('over'); uploadMusic(e.dataTransfer.files[0]); });
  $('btn-music-pick').onclick = () => $('music-input').click();
  $('music-input').onchange = e => { uploadMusic(e.target.files[0]); e.target.value = ''; };

  // --- prova musica
  let testAudio = null;
  $('btn-test-music').onclick = () => {
    if (testAudio) { testAudio.pause(); testAudio = null; $('btn-test-music').textContent = 'Prova musica'; return; }
    const s = getSettings();
    if (!s.musicFile) { alert('Carica prima un brano.'); return; }
    testAudio = new Audio(musicSrc(s.musicFile));
    testAudio.volume = s.musicVolume;
    testAudio.onended = () => { testAudio = null; $('btn-test-music').textContent = 'Prova musica'; };
    testAudio.play().then(() => { $('btn-test-music').textContent = 'Ferma'; })
      .catch(() => { testAudio = null; alert('Non riesco a riprodurre il file: controlla nome e percorso.'); });
  };

  // aggiorna il pannello quando la sorgente OBS scarica nuovi dati
  onChange(k => {
    if (k === K.data || k === K.status) renderCategories();
    if (k === 'account') renderAccount();
    if (k === K.settings && !inputs().includes(document.activeElement)) { fillInputs(); renderSections(); }
  });
}

boot().then(() => { if (MODE === 'panel') startPanel(); else startRollPlayer(); });
</script>
</body>
</html>
